apiVersion: v1
kind: Service
metadata:
  name: ecommercewebapi-service
  namespace: ecommercewebapi
  labels:
    app: ecommercewebapi
    managed-by: kubectl
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: ecommercewebapi
